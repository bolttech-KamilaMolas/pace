<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Lead - Capacity Planner</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <style>
        :root {
            --bt-navy: #170F4F;
            --bt-cyan: #00BAC7;
            --bt-cyan-light: #66D6DD;
            --bt-cyan-pale: #F2FBFC;
            --bt-navy-medium: #746F95;
            --bt-navy-light: #D1CFDC;
            --bt-navy-vlight: #F3F3F6;
            --text-primary: #170F4F;
            --text-secondary: #746F95;
            --border: #CCF1F4;
            --success: #039855;
            --error: #D92D20;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bt-navy-vlight);
            color: var(--text-primary);
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: var(--text-primary);
        }

        .sprint-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .sprint-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .sprint-btn:hover {
            border-color: var(--bt-cyan);
            background: var(--bt-cyan-pale);
        }

        .sprint-btn.active {
            background: var(--bt-cyan);
            border-color: var(--bt-cyan);
            color: white;
        }

        .header .sprint-info {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* CAPACITY OVERVIEW TABLE */
        .capacity-overview {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .capacity-table {
            width: 100%;
            border-collapse: collapse;
        }

        .capacity-table thead {
            background: var(--bt-navy);
            color: white;
        }

        .capacity-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .capacity-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .capacity-table tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .capacity-table tbody tr:hover {
            background: var(--bt-navy-vlight);
        }

        .capacity-table tbody tr.expanded {
            background: var(--bt-cyan-pale);
        }

        .team-name-cell {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .expand-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
        }

        .utilization-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .bar {
            flex: 1;
            height: 24px;
            background: #e2e5ef;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        .bar-fill.ok { background: var(--success); }
        .bar-fill.high { background: #f59e0b; }
        .bar-fill.overloaded { background: var(--error); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
        }

        .status-badge.ok { background: rgba(3, 152, 85, 0.1); }
        .status-badge.high { background: rgba(245, 158, 11, 0.1); }
        .status-badge.overloaded { background: rgba(217, 45, 32, 0.1); }

        /* TEAM DETAILS EXPANSION */
        .team-details {
            display: none;
        }

        .team-details.expanded {
            display: table-row;
        }

        .team-details td {
            padding: 20px 16px !important;
            background: var(--bt-cyan-pale);
            border-bottom: 2px solid var(--border);
        }

        .details-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        .details-content .details-section:nth-child(n+4) {
            grid-column: 1 / -1;
        }

        .details-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--bt-navy);
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .details-section ul {
            list-style: none;
            font-size: 13px;
            line-height: 1.8;
            padding: 0;
            margin: 0;
        }

        .details-section li {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .details-section li .emoji {
            width: 16px;
            text-align: center;
        }

        .goal-item {
            padding: 8px 12px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .goal-status {
            display: inline-block;
            margin-right: 6px;
            font-weight: 600;
        }

        .person-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .person-item:last-child {
            border-bottom: none;
        }

        .person-availability {
            color: var(--text-secondary);
        }

        .person-availability.available {
            color: var(--success);
            font-weight: 600;
        }

        .person-availability.off {
            color: var(--error);
            font-weight: 600;
        }

        .risk-item {
            padding: 8px 12px;
            background: white;
            border-left: 3px solid var(--error);
            border-radius: 2px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .risk-item .risk-title {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .risk-item .risk-meta {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .details-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .details-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;
            color: var(--bt-navy);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .details-btn:hover {
            background: var(--bt-cyan);
            border-color: var(--bt-cyan);
            color: white;
        }

        .details-btn.primary {
            background: var(--bt-cyan);
            border-color: var(--bt-cyan);
            color: white;
        }

        /* WORK BREAKDOWN SECTION */
        .work-breakdown-section {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .work-breakdown-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--bt-navy);
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .work-breakdown-legend {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .work-breakdown-header {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1.5fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 8px 8px 8px 8px;
            border-bottom: 1px solid var(--border);
            box-sizing: border-box;
            border-left: 3px solid transparent;
            align-items: center;
        }
        
        .work-breakdown-header-col {
            text-align: center;
        }
        
        .work-breakdown-header-col:first-child {
            text-align: left;
            grid-column: 1;
        }
        
        .work-breakdown-header-col:last-child {
            text-align: right;
        }

        .work-breakdown-item {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1.5fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 12px;
            padding: 8px 8px 8px 8px;
            align-items: center;
            box-sizing: border-box;
            border-radius: 4px;
            border-left: 3px solid transparent;
        }
        
        .work-breakdown-item.has-warning {
            background: var(--bt-cyan-pale);
            border-left-color: var(--bt-cyan);
        }
        
        .work-breakdown-item > .work-breakdown-label {
            align-self: center;
        }
        
        .work-breakdown-item > .work-breakdown-warning {
            align-self: center;
            text-align: right;
        }

        .work-breakdown-label {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .work-breakdown-label span:first-child {
            font-size: 14px;
        }

        .work-breakdown-label span:last-child {
            font-weight: 600;
            color: var(--text-primary);
        }

        .work-breakdown-warning {
            text-align: right;
            font-weight: 600;
            color: var(--error);
            font-size: 12px;
            padding: 4px 8px;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .work-breakdown-col {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            min-width: 0;
        }

        .work-breakdown-bar {
            height: 16px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: visible;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            flex-shrink: 0;
        }

        .work-breakdown-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }

        .work-breakdown-value {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            text-align: center;
            flex-shrink: 0;
        }

        .work-breakdown-bar-fill.plan {
            opacity: 0.5;
        }

        .work-breakdown-bar-fill.actual {
            opacity: 0.85;
        }
        
        .work-breakdown-bar-fill.actual-overflow {
            background: var(--error) !important;
            opacity: 1;
            animation: pulse-over 2s ease-in-out infinite;
        }
        
        @keyframes pulse-over {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .work-breakdown-bar-label {
            position: static;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-primary);
            pointer-events: none;
            margin-left: 8px;
            white-space: nowrap;
        }

        /* Color palette for work breakdown - using Navy + Cyan variations */
        .work-breakdown-bar-fill.projects { background: var(--bt-cyan); }
        .work-breakdown-bar-fill.bau { background: var(--bt-cyan-light); }
        .work-breakdown-bar-fill.maintenance { background: var(--bt-navy); }
        .work-breakdown-bar-fill.scrum { background: var(--bt-navy-light); }
        .work-breakdown-bar-fill.overhead { background: var(--bt-navy-medium); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .capacity-table th,
            .capacity-table td {
                padding: 10px 8px;
                font-size: 11px;
            }

            .details-content {
                grid-template-columns: 1fr;
            }

            .work-breakdown-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .work-breakdown-col {
                grid-column: 1;
            }
        }

        /* SKELETON LOADING */
        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍💼 Squad Lead Dashboard</h1>
            <div class="sprint-selector">
                <button class="sprint-btn active" data-sprint-idx="0" onclick="switchSprint(0)">
                    📌 Current Sprint
                </button>
                <button class="sprint-btn" data-sprint-idx="1" onclick="switchSprint(1)">
                    ⏭️ Next Sprint
                </button>
            </div>
            <div class="sprint-info" id="sprint-info">
                Current Sprint: Sprint 1 (Jan 6-17)
            </div>
        </div>

        <div class="capacity-overview">
            <table class="capacity-table">
                <thead>
                    <tr>
                        <th style="width: 150px;">Team</th>
                        <th style="width: 100px;">FTE Available</th>
                        <th style="width: 100px;">Allocated</th>
                        <th style="width: 150px;">Utilization</th>
                        <th style="width: 80px;">Status</th>
                    </tr>
                </thead>
                <tbody id="capacity-tbody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- WORK BREAKDOWN -->
        <div class="work-breakdown-section">
            <h3>📊 Work Breakdown - Plan vs Actual (MD)</h3>
            <div class="work-breakdown-legend">
                Plan (jasnoniebieskie) = planowana alokacja | Actual (ciemniebieskie + czerwone overflow)
            </div>
            <div id="breakdown-grid">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="mock-data.js"></script>
    <script src="squadlead.js"></script>
</body>
</html>
